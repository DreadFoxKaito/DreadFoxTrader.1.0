{% extends "layout.html" %}
{% block content %}
<h2 style="margin-top:0">Edit Cryptid</h2>
<div class="card">
  <form method="post" action="/algorithms/{{ algo_id }}/edit" id="cryptid_form">
    <label>Base Algo</label>
    <select name="base_script_id" id="base_script_select" required>
      <option value="" disabled>Select a base algo</option>
      {% for s in scripts %}
        <option value="{{ s.id }}" {% if s.id == base_script_id %}selected{% endif %}>{{ s.name }}</option>
      {% endfor %}
    </select>
    <div id="base_algo_desc" class="small" style="margin-top:6px;"></div>

    <div class="hr" style="margin:14px 0;"></div>

    <label>Cryptid Name</label>
    <input name="name" value="{{ algo_name }}" required>

    <div style="margin-top:10px">
      <label>Restart on crash</label>
      <select name="restart_on_crash">
        <option value="1" {% if restart_on_crash %}selected{% endif %}>Yes</option>
        <option value="0" {% if not restart_on_crash %}selected{% endif %}>No</option>
      </select>
    </div>

    <div class="hr" style="margin:14px 0;"></div>

    <h3 style="margin:0 0 8px 0;">Strategy Parameters</h3>
    <div id="param_fields"></div>
    <input type="hidden" name="params_json" id="params_json" value="{}">

    <div class="row" style="margin-top:12px">
      <button class="btn primary" type="submit">Save</button>
      <a class="btn" href="/algorithms">Cancel</a>
    </div>
  </form>
</div>

<script>
  const BASE_ALGO_DEFS = {{ base_algo_defs_json | safe }};
  const EXISTING_PARAMS = {{ params_json | safe }};
  const baseSelect = document.getElementById("base_script_select");
  const baseDesc = document.getElementById("base_algo_desc");
  const paramFields = document.getElementById("param_fields");
  const paramsJson = document.getElementById("params_json");
  let indicatorForgeRules = [];

  function escHtml(s) {
    return String(s || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll("\"", "&quot;")
      .replaceAll("'", "&#39;");
  }

  function renderBaseDescription(desc) {
    const raw = String(desc || "").trim();
    if (!raw) {
      baseDesc.textContent = "Select a base algo to continue.";
      return;
    }
    const parts = raw
      .split(/(?<=\.)\s+(?=[A-Z0-9])/)
      .map((p) => p.trim())
      .filter(Boolean);
    if (parts.length <= 1) {
      baseDesc.textContent = raw;
      return;
    }
    baseDesc.innerHTML =
      "<ul style='margin:6px 0 0 18px; padding:0;'>" +
      parts.map((p) => `<li style='margin:2px 0;'>${escHtml(p)}</li>`).join("") +
      "</ul>";
  }

  function buildInput(def) {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "10px";
    wrap.dataset.paramWrapKey = def.key;

    const label = document.createElement("label");
    label.textContent = def.label || def.key;
    wrap.appendChild(label);

    let input;
    if (def.type === "select") {
      input = document.createElement("select");
      (def.options || []).forEach((opt) => {
        const o = document.createElement("option");
        o.value = opt.value;
        o.textContent = opt.label || opt.value;
        input.appendChild(o);
      });
      if (def.default !== undefined) input.value = String(def.default);
    } else if (def.type === "boolean") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(def.default);
    } else if (def.type === "textarea") {
      input = document.createElement("textarea");
      input.rows = 6;
      if (def.placeholder) input.placeholder = def.placeholder;
      if (def.default !== undefined) input.value = String(def.default);
    } else {
      input = document.createElement("input");
      input.type = def.type === "number" ? "number" : "text";
      if (def.placeholder) input.placeholder = def.placeholder;
      if (def.step) input.step = def.step;
      if (def.default !== undefined) input.value = String(def.default);
    }

    input.dataset.paramKey = def.key;
    input.dataset.paramType = def.type || "text";
    input.dataset.normalize = def.normalize || "";
    if (def.required) input.required = true;
    if (def.default !== undefined) input.dataset.defaultValue = String(def.default);

    wrap.appendChild(input);

    if (def.help) {
      const help = document.createElement("div");
      help.className = "small";
      help.textContent = def.help;
      wrap.appendChild(help);
    }

    input.addEventListener("input", updateParams);
    input.addEventListener("change", updateParams);
    return wrap;
  }

  function isEntangledTickersPath(pathValue) {
    const p = String(pathValue || "").toLowerCase();
    return p.endsWith("scripts/entangledtickers.robinhood.py")
      || p.endsWith("scripts/entangledtickers.schwab.py");
  }

  function isIndicatorForge(def) {
    const p = String((def && def.path) || "").toLowerCase();
    return p.endsWith("scripts/indicatorforge.robinhood.py")
      || p.endsWith("scripts/indicatorforge.crypto.robinhood.py")
      || p.endsWith("scripts/indicatorforge.schwab.py")
      || isEntangledTickersPath(p);
  }

  function normalizeIndicatorRuleTimeframe(raw, fallback = "1h") {
    const aliases = {
      "1min": "1m",
      "1minute": "1m",
      "5min": "5m",
      "5minute": "5m",
      "10min": "10m",
      "10minute": "10m",
      "15min": "15m",
      "15minute": "15m",
      "30min": "30m",
      "30minute": "30m",
      "60m": "1h",
      "60min": "1h",
      "1hr": "1h",
      "1hour": "1h",
      "hour": "1h",
      "daily": "1d",
      "day": "1d"
    };
    const allowed = new Set(["1m", "5m", "10m", "15m", "30m", "1h", "1d"]);
    let value = String(raw || "").trim().toLowerCase();
    value = aliases[value] || value;
    if (allowed.has(value)) return value;
    let fb = String(fallback || "").trim().toLowerCase();
    fb = aliases[fb] || fb;
    if (allowed.has(fb)) return fb;
    return (fallback === "" || fallback === null || typeof fallback === "undefined") ? "" : "1h";
  }

  function parseRulesValue(raw) {
    if (!raw) return [];
    try {
      const obj = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (!Array.isArray(obj)) return [];
      return obj
        .filter((r) => r && typeof r === "object")
        .flatMap((r) => {
          const rule = { ...r };
          const params = rule.params && typeof rule.params === "object" ? { ...rule.params } : {};
          const kind = String(rule.kind || "").trim().toLowerCase();
          if (rule.timeframe || params.timeframe) {
            rule.timeframe = normalizeIndicatorRuleTimeframe(rule.timeframe || params.timeframe, "");
          }
          if (kind === "ma" || kind === "ema") {
            params.mode = normalizeMaMode(params.mode);
            if (params.mode === "ribbon") {
              const levels = maRibbonLevelsFromParams(params);
              return levels.map((level) => maMappedRuleFromLevel(rule, level));
            } else if (params.mode === "mapped") {
              params.above_action = normalizeMaAction(params.above_action);
              params.below_action = normalizeMaAction(params.below_action);
            } else {
              const buyRel = String(params.buy_relation || "").trim().toLowerCase();
              const sellRel = String(params.sell_relation || "").trim().toLowerCase();
              if (buyRel === "ignore" || buyRel === "") params.buy_relation = "hold";
              if (sellRel === "ignore" || sellRel === "") params.sell_relation = "hold";
            }
          } else if (kind === "rsi") {
            const osAction = String(params.oversold_action || "").trim().toLowerCase();
            const obAction = String(params.overbought_action || "").trim().toLowerCase();
            if (osAction === "ignore") params.oversold_action = "hold";
            if (obAction === "ignore") params.overbought_action = "hold";
          }
          rule.params = params;
          return [rule];
        });
    } catch (_) {
      return [];
    }
  }

  const MA_RIBBON_LEVEL_ORDER = ["short", "medium", "long"];
  const MA_RIBBON_DEFAULT_LENGTHS = { short: 30, medium: 78, long: 190 };
  const MA_RIBBON_LEVEL_LABELS = { short: "Short", medium: "Medium", long: "Long" };

  function normalizeMaMode(raw) {
    const mode = String(raw || "single").trim().toLowerCase();
    if (mode === "ribbon" || mode === "ma_ribbon") return "ribbon";
    if (mode === "mapped" || mode === "level" || mode === "action_map" || mode === "ribbon_level") return "mapped";
    return "single";
  }

  function normalizeMaType(raw, fallback = "sma") {
    const value = String(raw || fallback || "sma").trim().toLowerCase();
    return value === "ema" ? "ema" : "sma";
  }

  function normalizeMaAction(raw) {
    const value = String(raw || "hold").trim().toLowerCase();
    if (value === "buy" || value === "sell") return value;
    return "hold";
  }

  function maRibbonLevelsFromParams(params) {
    const p = params && typeof params === "object" ? params : {};
    const bySlot = new Map();
    if (Array.isArray(p.levels)) {
      p.levels.forEach((raw) => {
        if (!raw || typeof raw !== "object") return;
        const slot = String(raw.slot || raw.name || "").trim().toLowerCase();
        if (!MA_RIBBON_LEVEL_ORDER.includes(slot) || bySlot.has(slot)) return;
        bySlot.set(slot, raw);
      });
    }
    const pick = (rawValue, ...fallbacks) => {
      if (rawValue !== null && rawValue !== undefined && rawValue !== "") return rawValue;
      for (const item of fallbacks) {
        if (item !== null && item !== undefined && item !== "") return item;
      }
      return null;
    };
    return MA_RIBBON_LEVEL_ORDER.map((slot) => {
      const raw = bySlot.get(slot) || {};
      const rawLength = pick(raw.length, p[`${slot}_length`], p[`ribbon_${slot}_length`]);
      return {
        slot,
        label: MA_RIBBON_LEVEL_LABELS[slot],
        ma_type: normalizeMaType(pick(raw.ma_type, p[`${slot}_type`], p[`ribbon_${slot}_type`]), "sma"),
        length: Math.max(2, parseInt(String(rawLength || MA_RIBBON_DEFAULT_LENGTHS[slot]), 10) || MA_RIBBON_DEFAULT_LENGTHS[slot]),
        above_action: normalizeMaAction(pick(raw.above_action, p[`${slot}_above_action`], p[`ribbon_${slot}_above_action`])),
        below_action: normalizeMaAction(pick(raw.below_action, p[`${slot}_below_action`], p[`ribbon_${slot}_below_action`]))
      };
    });
  }

  function maMappedRuleFromLevel(rule, level) {
    const r = rule && typeof rule === "object" ? rule : {};
    const params = r.params && typeof r.params === "object" ? r.params : {};
    const slot = String((level && level.slot) || "").trim().toLowerCase();
    const lineTag = level && level.ma_type === "ema" ? "EMA" : "SMA";
    const length = Math.max(2, parseInt(String((level && level.length) || MA_RIBBON_DEFAULT_LENGTHS[slot] || 30), 10) || (MA_RIBBON_DEFAULT_LENGTHS[slot] || 30));
    const baseName = String(r.name || "MA Ribbon").trim() || "MA Ribbon";
    const childId = maRibbonLevelRuleId(params.rule_id, slot);
    return {
      name: `${baseName} - ${String((level && level.label) || MA_RIBBON_LEVEL_LABELS[slot] || "Level")} ${lineTag}${length}`,
      kind: "ma",
      timeframe: (r.timeframe || params.timeframe)
        ? normalizeIndicatorRuleTimeframe(r.timeframe || params.timeframe, "")
        : "",
      params: {
        mode: "mapped",
        ma_type: normalizeMaType(level && level.ma_type, "sma"),
        length,
        above_action: normalizeMaAction(level && level.above_action),
        below_action: normalizeMaAction(level && level.below_action),
        rule_id: childId || String((params && params.rule_id) || "").trim() || undefined
      }
    };
  }

  function maRibbonLevelRuleId(ruleId, slot) {
    const rid = String(ruleId || "").trim();
    const slotKey = String(slot || "").trim().toLowerCase();
    if (!rid || !MA_RIBBON_LEVEL_ORDER.includes(slotKey)) return "";
    return `${rid}::${slotKey}`;
  }

  function maRibbonLevelDisplayName(rule, levelOrSlot) {
    const r = rule && typeof rule === "object" ? rule : {};
    const params = r.params && typeof r.params === "object" ? r.params : {};
    const slot = typeof levelOrSlot === "string"
      ? String(levelOrSlot).trim().toLowerCase()
      : String((levelOrSlot && levelOrSlot.slot) || "").trim().toLowerCase();
    const level = (typeof levelOrSlot === "object" && levelOrSlot)
      ? levelOrSlot
      : maRibbonLevelsFromParams(params).find((item) => item.slot === slot);
    const baseName = String(r.name || r.kind || "RULE").trim() || "RULE";
    const label = level && level.label ? level.label : (MA_RIBBON_LEVEL_LABELS[slot] || "Level");
    const lineTag = level && level.ma_type === "ema" ? "EMA" : "SMA";
    const fallbackLen = MA_RIBBON_DEFAULT_LENGTHS[slot] || 30;
    const length = Math.max(2, parseInt(String((level && level.length) || fallbackLen), 10) || fallbackLen);
    return `${baseName} - ${label} ${lineTag}${length}`;
  }

  function maRibbonLevelSummaryLine(level) {
    const lineTag = level && level.ma_type === "ema" ? "EMA" : "SMA";
    const label = String((level && level.label) || "Level");
    const length = Math.max(2, parseInt(String((level && level.length) || "30"), 10) || 30);
    const above = String((level && level.above_action) || "hold").toUpperCase();
    const below = String((level && level.below_action) || "hold").toUpperCase();
    return `${label} ${lineTag}${length}: above -> ${above}; below -> ${below}.`;
  }

  function indicatorForgeRuleTargetEntries(options = {}) {
    const excludeKinds = new Set(
      Array.isArray(options.excludeKinds)
        ? options.excludeKinds.map((k) => String(k || "").trim().toLowerCase())
        : []
    );
    const out = [];
    indicatorForgeRules.forEach((r, i) => {
      const kindRaw = String(r && r.kind ? r.kind : "").trim().toLowerCase();
      if (!kindRaw || excludeKinds.has(kindRaw)) return;
      const kind = escHtml(kindRaw.toUpperCase() || "RULE");
      const rawName = String(r && r.name ? r.name : "").trim();
      const name = rawName || `${kindRaw.toUpperCase() || "RULE"}${i + 1}`;
      const params = r && r.params && typeof r.params === "object" ? r.params : {};
      const rid = String(params.rule_id || "").trim();
      if (!rid) return;
      const tf = normalizeIndicatorRuleTimeframe((r && r.timeframe) || params.timeframe, "1h");
      out.push({
        id: rid,
        label: `#${i + 1} ${kindRaw.toUpperCase() || "RULE"} [${tf}] - ${name}`,
        summary: `#${i + 1} ${name} [${tf}]`
      });
      if ((kindRaw === "ma" || kindRaw === "ema") && normalizeMaMode(params.mode) === "ribbon") {
        maRibbonLevelsFromParams(params).forEach((level) => {
          const childId = maRibbonLevelRuleId(rid, level.slot);
          if (!childId) return;
          const childName = maRibbonLevelDisplayName(r, level);
          const suffix = String(level.label || "L").charAt(0).toUpperCase() || "L";
          out.push({
            id: childId,
            label: `#${i + 1}.${suffix} MA LEVEL [${tf}] - ${childName}`,
            summary: `#${i + 1} ${childName} [${tf}]`
          });
        });
      }
    });
    return out;
  }

  function renderIndicatorForgeBuilder() {
    const existing = document.getElementById("indicator_forge_builder");
    if (existing) existing.remove();
    const textarea = paramFields.querySelector('[data-param-key="indicator_rules_json"]');
    if (!textarea) return;
    const getInput = (k) => paramFields.querySelector(`[data-param-key="${k}"]`);
    const allWraps = paramFields.querySelectorAll("[data-param-wrap-key]");
    allWraps.forEach((w) => { w.style.display = "none"; });

    const symbolsInput = getInput("symbols");
    const primarySymbolInput = getInput("primary_symbol");
    const inverseSymbolInput = getInput("inverse_symbol");
    const timeframeInput = getInput("timeframe");
    const sleepInput = getInput("sleep_duration");
    const sharesInput = getInput("shares_per_trade");
    const tradeAmountInput = getInput("trade_amount");
    const orderSizeInput = tradeAmountInput || sharesInput;
    const orderSizeLabel = tradeAmountInput ? "Trade Amount ($)" : "Shares per Trade";
    const orderSizeStep = tradeAmountInput ? "0.01" : "1";
    const trailAmountInput = getInput("trailing_stop_amount");
    const trailModeInput = getInput("trailing_stop_mode");
    const trailAtrMultInput = getInput("trailing_stop_atr_mult");
    const buyOrderTypeInput = getInput("buy_order_type");
    const sellOrderTypeInput = getInput("sell_order_type");
    const pivotPreorderEnabledInput = getInput("pivot_preorder_enabled");
    const pivotPreorderOffsetInput = getInput("pivot_preorder_offset");
    const pivotPreorderHalfInput = getInput("pivot_preorder_include_half_levels");
    const pivotPreorderFallbackInput = getInput("pivot_preorder_fallback_pct");
    const stoplossEnabledInput = getInput("stoploss_enabled");
    const allowExtendedHoursInput = getInput("allow_extended_hours_orders");
    const includeExtendedHoursDataInput = getInput("include_extended_hours_data");
    const allowOvernightInput = getInput("allow_seamless_overnight_orders");
    const targetGainInput = getInput("target_gain_pct");
    const stopLossPctInput = getInput("stop_loss_pct");
    const capRuleEnabledInput = getInput("portfolio_cap_rule_enabled");
    const capModeInput = getInput("portfolio_cap_mode");
    const capPercentInput = getInput("portfolio_cap_percent_by_symbol");
    const capCashInput = getInput("portfolio_cash_percent");
    const capCashSourceInput = getInput("portfolio_cash_source");
    const capDivisorInput = getInput("portfolio_cap_divisor");
    const curDef = BASE_ALGO_DEFS[String(baseSelect.value)] || {};
    const curPath = String((curDef && curDef.path) || "").toLowerCase();
    const isEntangledTickers = isEntangledTickersPath(curPath);
    const isRobinhoodStockIndicatorForge = curPath.endsWith("scripts/indicatorforge.robinhood.py")
      || curPath.endsWith("scripts/entangledtickers.robinhood.py");
    const isStockIndicatorForge = curPath.endsWith("scripts/indicatorforge.schwab.py")
      || curPath.endsWith("scripts/indicatorforge.robinhood.py")
      || curPath.endsWith("scripts/entangledtickers.schwab.py")
      || curPath.endsWith("scripts/entangledtickers.robinhood.py");
    const orderTypeOptionHtml = isStockIndicatorForge
      ? "<option value='market'>Market</option><option value='trailing_stop'>Trailing Stop</option><option value='limit_midpoint'>Limit Midpoint (Bid/Ask)</option>"
      : "<option value='market'>Market</option><option value='local_trailing'>Local Trailing</option>";
    const showOvernightInput = Boolean(allowOvernightInput);
    const overnightLabel = isRobinhoodStockIndicatorForge
      ? "Allow Robinhood Overnight Trading (all-day limit orders)"
      : "Enable Overnight Session (SEAMLESS)";
    const extendedOrdersLabel = isRobinhoodStockIndicatorForge
      ? "Allow Robinhood Extended Hours (premarket/after-hours midpoint limit orders)"
      : "Allow Extended Hours Trading";

    indicatorForgeRules = parseRulesValue(textarea.value || "");
    let ruleIdSeq = 0;

    function nextRuleId() {
      ruleIdSeq += 1;
      return `ifr_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}_${ruleIdSeq}`;
    }

    function ensureRuleIdentity(rule) {
      if (!rule || typeof rule !== "object") return;
      if (!rule.params || typeof rule.params !== "object") rule.params = {};
      const existing = String(rule.params.rule_id || "").trim();
      if (!existing) rule.params.rule_id = nextRuleId();
    }

    const b = document.createElement("div");
    b.id = "indicator_forge_builder";
    b.className = "grid";
    b.style.marginTop = "10px";
    b.innerHTML = `
      <div class="card" style="grid-column: span 12;">
        <h3 style="margin:0 0 8px 0;">IndicatorForge Builder</h3>
        <div class="small">Same indicator engine as Markets, but rules are local to this cryptid and saved into <code>indicator_rules_json</code>.</div>
      </div>
      <div class="card" style="grid-column: span 12;">
        <h3 style="margin:0 0 8px 0;">${isEntangledTickers ? "Entanglement" : "Scan Universe"}</h3>
        <div class="grid" style="grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top:10px;">
          ${isEntangledTickers
            ? "<div><label>Primary Symbol</label><input id='if_exec_primary_symbol' placeholder='AAPL' /></div><div><label>Inverse Symbol</label><input id='if_exec_inverse_symbol' placeholder='MSFT' /></div>"
            : "<div><label>Symbols</label><input id='if_exec_symbols' placeholder='AAPL, MSFT' /></div>"}
          <div><label>Timeframe</label><select id="if_exec_timeframe"></select></div>
        </div>
      </div>
      <div class="card" style="grid-column: span 12;">
        <h3 style="margin:0 0 8px 0;">Indicator Rules</h3>
        <div class="grid" style="grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top:10px;">
          <div class="card" style="padding:10px;">
            <div class="small"><b>Add Moving Average Rule</b></div>
            <div class="row" style="margin-top:8px;">
              <input id="if_ma_name" placeholder="Name (optional)" style="width:100%;" />
              <select id="if_ma_mode"><option value="single" selected>Single Line Mode</option><option value="ribbon">Ribbon Mode</option></select>
            </div>
            <div id="if_ma_single_wrap" class="row" style="margin-top:8px;">
              <select id="if_ma_type"><option value="sma" selected>SMA</option><option value="ema">EMA</option></select>
              <input id="if_ma_length" type="number" min="2" step="1" value="30" placeholder="Length" style="width:100px;" />
              <select id="if_ma_buy"><option value="above">Buy: price above line</option><option value="below">Buy: price below line</option><option value="hold">Buy: hold</option></select>
              <select id="if_ma_sell"><option value="above">Sell: price above line</option><option value="below">Sell: price below line</option><option value="hold">Sell: hold</option></select>
              <label class="small"><input id="if_ma_d_on" type="checkbox" /> Track derivative</label>
              <input id="if_ma_d_buy" type="number" step="0.0001" placeholder="dLine buy >=" style="width:120px;" />
              <input id="if_ma_d_sell" type="number" step="0.0001" placeholder="dLine sell <=" style="width:120px;" />
              <label class="small"><input id="if_ma_unless_on" type="checkbox" /> Use Unless Override</label>
              <select id="if_ma_unless_rel"><option value="above">Unless line is above</option><option value="below">Unless line is below</option></select>
              <select id="if_ma_unless_type"><option value="sma">Unless target SMA</option><option value="ema">Unless target EMA</option></select>
              <input id="if_ma_unless_len" type="number" min="2" step="1" value="78" style="width:120px;" />
              <select id="if_ma_unless_action"><option value="sell">Override -> Sell</option><option value="buy">Override -> Buy</option></select>
            </div>
            <div id="if_ma_ribbon_wrap" class="grid" style="grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px; display:none; margin-top:8px;">
              <div class="card" style="padding:8px;">
                <div class="small"><b>Short</b></div>
                <div class="row" style="margin-top:8px;">
                  <select id="if_ma_ribbon_short_type"><option value="sma" selected>SMA</option><option value="ema">EMA</option></select>
                  <input id="if_ma_ribbon_short_length" type="number" min="2" step="1" value="30" placeholder="Length" style="width:100px;" />
                  <select id="if_ma_ribbon_short_above"><option value="buy">Above -> Buy</option><option value="sell">Above -> Sell</option><option value="hold">Above -> Hold</option></select>
                  <select id="if_ma_ribbon_short_below"><option value="hold">Below -> Hold</option><option value="buy">Below -> Buy</option><option value="sell">Below -> Sell</option></select>
                </div>
              </div>
              <div class="card" style="padding:8px;">
                <div class="small"><b>Medium</b></div>
                <div class="row" style="margin-top:8px;">
                  <select id="if_ma_ribbon_medium_type"><option value="sma" selected>SMA</option><option value="ema">EMA</option></select>
                  <input id="if_ma_ribbon_medium_length" type="number" min="2" step="1" value="78" placeholder="Length" style="width:100px;" />

    function normalizeIchiConditionList(raw, fallback = "hold") {
      let items = [];
      if (Array.isArray(raw)) {
        items = raw;
      } else if (typeof raw === "string") {
        const txt = String(raw || "").trim();
        if (txt.includes(",")) items = txt.split(",");
        else if (txt) items = [txt];
      } else if (raw !== undefined && raw !== null) {
        items = [raw];
      }
      const out = [];
      const seen = new Set();
      items.forEach((item) => {
        const v = normalizeIchiConditionValue(item);
        if (!v || seen.has(v)) return;
        seen.add(v);
        out.push(v);
      });
      if (!out.length) out.push(String(fallback || "hold").trim().toLowerCase() || "hold");
      let normalized = out;
      if (normalized.length > 1) normalized = normalized.filter((v) => v !== "hold");
      if (!normalized.length) normalized = ["hold"];
      return normalized;
    }

      Array.from(sel.options || []).forEach((opt) => {
        const v = String(opt.value || "").trim().toLowerCase();
        const on = target.has(v);
        opt.selected = on;
        if (on) picked += 1;
      });
      if (picked > 0) return;
      const holdOpt = Array.from(sel.options || []).find((opt) => String(opt.value || "").trim().toLowerCase() === "hold");
      if (holdOpt) holdOpt.selected = true;
      else if (sel.options.length) sel.options[0].selected = true;
    }

    function wireCollapsibleIchiMultiSelect(selector) {
      const sel = b.querySelector(selector);
      if (!sel) return;
      const expanded = Math.max(2, parseInt(String(sel.dataset.expandedSize || "10"), 10) || 10);
      const collapse = () => { sel.size = 1; };
      const expand = () => { sel.size = expanded; };
      collapse();
      sel.addEventListener("focus", expand);
      sel.addEventListener("mousedown", expand);
      sel.addEventListener("touchstart", expand, { passive: true });
      sel.addEventListener("blur", () => {
        window.setTimeout(() => {
          if (document.activeElement !== sel) collapse();
        }, 60);
      });
      sel.addEventListener("keydown", (ev) => {
        const k = String(ev.key || "");
        if (k === "Escape") {
          sel.blur();
          collapse();
          return;
        }
        if (k === "Enter" || k === " " || k === "ArrowDown" || k === "ArrowUp") {
          expand();
        }
      });
    }

    function syncIchiBlockOptions() {
      const buySel = b.querySelector("#if_ichi_buy_cond");
      const sellSel = b.querySelector("#if_ichi_sell_cond");
      const blockSel = b.querySelector("#if_ichi_block_cond");
      if (!buySel || !sellSel || !blockSel) return;
      const current = normalizeIchiConditionList(getMultiSelectValues(blockSel), "hold");
      const seen = new Set();
      blockSel.innerHTML = "";
      const add = (value, label) => {
        const v = String(value || "").trim().toLowerCase();
        if (!v || seen.has(v)) return;
        seen.add(v);
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = label;
        blockSel.appendChild(opt);
      };
      add("hold", "BLOCK/HOLD: disabled");
      [buySel, sellSel].forEach((sel) => {
        Array.from(sel.options || []).forEach((opt) => {
          const v = String(opt.value || "").trim().toLowerCase();
          if (!v || v === "hold") return;
          const txt = String(opt.textContent || v)
            .replace(/^BUY:\s*/i, "")
            .replace(/^SELL:\s*/i, "")
            .trim();
          add(v, `BLOCK/HOLD: ${txt}`);
        });
      });
      setMultiSelectValues(blockSel, current, "hold");
    }

    function scopeTxt(scope) {
      const s = String(scope || "both").trim().toLowerCase();
      if (s === "buy") return "BUY only";
      if (s === "sell") return "SELL only";
      return "BUY and SELL";
    }

    function dualSignalScope(raw) {
      const s = String(raw || "both").trim().toLowerCase();
      if (s === "buy" || s === "sell") return s;
      return "both";
    }

    function targetLabelList(raw) {
      const ids = Array.isArray(raw) ? raw : [];
      const entries = indicatorForgeRuleTargetEntries();
      const byId = new Map(entries.map((entry) => [String(entry.id || ""), String(entry.summary || entry.label || "")]));
      const out = [];
      ids.forEach((id) => {
        const rid = String(id || "").trim();
        if (!rid) return;
        out.push(byId.get(rid) || rid);
      });
      return out.length ? out.join(", ") : "none selected";
    }

    function ruleSummaryLines(rule, idx) {
      const r = rule && typeof rule === "object" ? rule : {};
      const kind = String(r.kind || "").trim().toLowerCase();
      const p = r.params && typeof r.params === "object" ? r.params : {};
      const lines = [];
      lines.push(`Timeframe: ${ruleTimeframe(r)}.`);

      if (kind === "ma" || kind === "ema") {
        if (normalizeMaMode(p.mode) === "ribbon") {
          lines.push("MA Ribbon: BUY/SELL only when short, medium, and long all agree; otherwise HOLD.");
          maRibbonLevelsFromParams(p).forEach((level) => {
            const lineTag = level.ma_type === "ema" ? "EMA" : "SMA";
            lines.push(
              `${level.label} ${lineTag}${level.length}: above -> ${String(level.above_action).toUpperCase()}; ` +
              `below -> ${String(level.below_action).toUpperCase()}.`
            );
          });
        } else if (normalizeMaMode(p.mode) === "mapped") {
          const maType = normalizeMaType(p.ma_type, kind === "ema" ? "ema" : "sma");
          const lineTag = maType === "ema" ? "EMA" : "SMA";
          const len = Math.max(2, parseInt(String(p.length || "30"), 10) || 30);
          lines.push(
            `${lineTag}${len}: above -> ${String(normalizeMaAction(p.above_action)).toUpperCase()}; ` +
            `below -> ${String(normalizeMaAction(p.below_action)).toUpperCase()}.`
          );
        } else {
          const maType = normalizeMaType(p.ma_type, kind === "ema" ? "ema" : "sma");
          const lineTag = maType === "ema" ? "EMA" : "SMA";
          const len = Math.max(2, parseInt(String(p.length || "30"), 10) || 30);
          lines.push(`${lineTag}${len}: BUY=${relTxt(p.buy_relation)}; SELL=${relTxt(p.sell_relation)}.`);
          if (Number(p.track_derivative || 0) === 1) {
            const buyD = asNumber(p.buy_derivative_min);
            const sellD = asNumber(p.sell_derivative_max);
            const buyTxt = buyD === null ? "any" : `>= ${fmtRuleNum(buyD, 4)}`;
            const sellTxt = sellD === null ? "any" : `<= ${fmtRuleNum(sellD, 4)}`;
            lines.push(`${maType === "ema" ? "dEMA" : "dMA"}${len} filter: BUY ${buyTxt}; SELL ${sellTxt}.`);
          }
          if (Number(p.unless_enabled || 0) === 1) {
            const uType = normalizeMaType(p.unless_type, "sma");
            const uTag = uType === "ema" ? "EMA" : "SMA";
            const uLen = Math.max(2, parseInt(String(p.unless_length || "30"), 10) || 30);
            const uRel = String(p.unless_relation || "above").trim().toLowerCase();
            const uAction = String(p.unless_action || "sell").trim().toUpperCase();
            lines.push(`Unless override: if ${lineTag}${len} ${uRel} ${uTag}${uLen} -> force ${uAction}.`);
          }
        }
      } else if (kind === "rsi") {
        const os = fmtRuleNum(p.oversold, 2);
        const ob = fmtRuleNum(p.overbought, 2);
        const osRel = String(p.oversold_relation || "below").trim().toLowerCase();
        const obRel = String(p.overbought_relation || "above").trim().toLowerCase();
        const osActionRaw = String(p.oversold_action || "buy").trim().toUpperCase();
        const obActionRaw = String(p.overbought_action || "sell").trim().toUpperCase();
        const osAction = (osActionRaw === "IGNORE" || osActionRaw === "HOLD") ? "HOLD" : osActionRaw;
        const obAction = (obActionRaw === "IGNORE" || obActionRaw === "HOLD") ? "HOLD" : obActionRaw;
        lines.push(`RSI thresholds: oversold ${osRel} ${os} -> ${osAction}; overbought ${obRel} ${ob} -> ${obAction}.`);
        if (Number(p.signal_override_enabled || 0) === 1) {
          lines.push(`Override enabled: ${scopeTxt(p.signal_override_scope)} on ${targetLabelList(p.signal_override_targets)}.`);
        }
      } else if (kind === "rsi_d") {
        lines.push(`dRSI lock: BUY >= ${fmtRuleNum(p.buy_above, 4)}; SELL <= ${fmtRuleNum(p.sell_below, 4)}.`);
      } else if (kind === "roc" || kind === "rate_of_change") {
        const len = Math.max(1, parseInt(String(p.length || "12"), 10) || 12);
        const buyCond = rocCondTxt(p.buy_condition);
        const sellCond = rocCondTxt(p.sell_condition);
        const buyThr = asNumber(p.buy_threshold_pct);
        const sellThr = asNumber(p.sell_threshold_pct);
        lines.push(`ROC (${len}): BUY=${buyCond}; SELL=${sellCond}.`);
        lines.push(
          `Thresholds (%): BUY ${fmtRuleNum(buyThr === null ? 0 : buyThr, 3)} / ` +
          `SELL ${fmtRuleNum(sellThr === null ? 0 : sellThr, 3)}.`
        );
      } else if (kind === "sar" || kind === "psar" || kind === "parabolic_sar" || kind === "parabolic") {
        const stepRaw = asNumber(p.step);
        const maxRaw = asNumber(p.max_step);
        const step = stepRaw === null ? 0.02 : Math.max(0.0001, stepRaw);
        const maxStep = maxRaw === null ? 0.2 : Math.max(step, maxRaw);
        const buyCond = sarCondTxt(p.buy_condition);
        const sellCond = sarCondTxt(p.sell_condition);
        lines.push(
          `Parabolic SAR (step ${fmtRuleNum(step, 4)}, max ${fmtRuleNum(maxStep, 4)}): ` +
          `BUY=${buyCond}; SELL=${sellCond}.`
        );
        lines.push("Cross conditions trigger only on the bar price flips through SAR.");
      } else if (kind === "donchian" || kind === "donchian_breakout") {
        const lookback = Math.max(1, parseInt(String(p.lookback || "20"), 10) || 20);
        const buyCond = donchianCondTxt(p.buy_condition || (p.use_high_break ? "high_above_upper" : "close_above_upper"));
        const sellCond = donchianCondTxt(p.sell_condition || "close_below_lower");
        lines.push(`Donchian (${lookback} prior bars): BUY=${buyCond}; SELL=${sellCond}.`);
      } else if (kind === "pivot" || kind === "pivot_points" || kind === "pivots") {
        const buyCond = pivotCondTxt(p.buy_condition || "above_p");
        const sellCond = pivotCondTxt(p.sell_condition || "below_p");
        const tol = Math.max(0, asNumber(p.tolerance_pct) ?? 0.25);
        lines.push(`Pivot Points: Buy: ${buyCond} | Sell: ${sellCond}.`);
        lines.push(`Uses previous completed candle; near tolerance ${fmtRuleNum(tol, 3)}%.`);
      } else if (kind === "supertrend" || kind === "supertrend_trend") {
        const atrLen = Math.max(1, parseInt(String(p.atr_length || "10"), 10) || 10);
        const multRaw = asNumber(p.multiplier);
        const mult = multRaw === null ? 3.0 : Math.max(0.1, multRaw);
        const buyCond = supertrendCondTxt(p.buy_condition || "trend_up");
        const sellCond = supertrendCondTxt(p.sell_condition || "trend_down");
        lines.push(`ST(${atrLen},${fmtRuleNum(mult, 3)}) | Buy: ${buyCond} | Sell: ${sellCond}.`);
        lines.push("State conditions can remain true for multiple candles; flip conditions trigger only when direction changes.");
      } else if (kind === "vwap" || kind === "vwap_filter") {
        const buyCond = vwapCondTxt(p.buy_condition || "within_band");
        const sellCond = vwapCondTxt(p.sell_condition || "exit_below");
        const ext = pctDecimal(p.max_extension_pct, 0.015);
        const pull = pctDecimal(p.max_pullback_pct, 0.010);
        const exit = pctDecimal(p.exit_below_pct, 0.012);
        lines.push(`VWAP: BUY=${buyCond}; SELL=${sellCond}.`);
        lines.push(`Band: pullback ${fmtRuleNum(pull * 100, 3)}%, extension ${fmtRuleNum(ext * 100, 3)}%, exit below ${fmtRuleNum(exit * 100, 3)}%.`);
      } else if (kind === "relative_volume" || kind === "rvol" || kind === "rel_volume") {
        const length = Math.max(1, parseInt(String(p.length || "20"), 10) || 20);
        const thresholdRaw = asNumber(p.threshold);
        const threshold = thresholdRaw === null ? 1.2 : Math.max(0, thresholdRaw);
        const buyCond = rvolCondTxt(p.buy_condition || "above_threshold");
        const sellCond = rvolCondTxt(p.sell_condition || "below_threshold");
        lines.push(`Relative Volume (${length}): BUY=${buyCond}; SELL=${sellCond}; threshold ${fmtRuleNum(threshold, 3)}.`);
      } else if (kind === "bb") {
        const len = Math.max(2, parseInt(String(p.length || "20"), 10) || 20);
        const stdMultRaw = asNumber(p.std_mult);
        const stdMult = stdMultRaw === null ? 2 : Math.max(0.1, stdMultRaw);
        const buyCond = bbCondTxt(p.buy_condition);
        const sellCond = bbCondTxt(p.sell_condition);
        const squeeze = asNumber(p.squeeze_threshold_pct);
        const pbBuy = asNumber(p.percent_b_buy_threshold);
        const pbSell = asNumber(p.percent_b_sell_threshold);
        lines.push(`Bollinger (${len}, ${fmtRuleNum(stdMult, 2)}σ): BUY=${buyCond}; SELL=${sellCond}.`);
        lines.push(
          `Squeeze threshold: <= ${fmtRuleNum(squeeze === null ? 5 : squeeze, 3)}% width; ` +
          `%B thresholds: BUY ${fmtRuleNum(pbBuy === null ? 0.2 : pbBuy, 3)} / SELL ${fmtRuleNum(pbSell === null ? 0.8 : pbSell, 3)}.`
        );
      } else if (kind === "ichimoku" || kind === "ichimoku_cloud" || kind === "ichi") {
        const tenkan = Math.max(1, parseInt(String(p.conversion_line_length || p.tenkan_length || "9"), 10) || 9);
        const kijun = Math.max(1, parseInt(String(p.base_line_length || p.kijun_length || "26"), 10) || 26);
        const senkouB = Math.max(2, parseInt(String(p.leading_span_b_length || p.senkou_b_length || "52"), 10) || 52);
        const displacement = Math.max(1, parseInt(String(p.lagging_line_displacement || p.displacement || "26"), 10) || 26);
        const delayed = Math.max(1, parseInt(String(p.delayed_cross_lookback || "3"), 10) || 3);
        const buyMode = normalizeIchiMatchMode(p.buy_match_mode, "all");
        const sellMode = normalizeIchiMatchMode(p.sell_match_mode, "all");
        const blockMode = normalizeIchiMatchMode(p.block_match_mode, "all");
        const buyCond = formatIchiConditionSet(
          Array.isArray(p.buy_conditions) && p.buy_conditions.length ? p.buy_conditions : p.buy_condition
        );
        const sellCond = formatIchiConditionSet(
          Array.isArray(p.sell_conditions) && p.sell_conditions.length ? p.sell_conditions : p.sell_condition
        );
        const blockCond = formatIchiConditionSet(
          Array.isArray(p.block_conditions) && p.block_conditions.length ? p.block_conditions : p.block_condition
        );
        const thick = asNumber(p.cloud_thickness_threshold_pct);
        const kijunTol = asNumber(p.base_line_bounce_tolerance_pct ?? p.kijun_bounce_tolerance_pct);
        lines.push(
          `Ichimoku (Conversion/Base/Leading B ${tenkan}/${kijun}/${senkouB}, disp ${displacement}): ` +
          `BUY(${buyMode.toUpperCase()})=${buyCond}; SELL(${sellMode.toUpperCase()})=${sellCond}; ` +
          `BLOCK/HOLD(${blockMode.toUpperCase()})=${blockCond}.`
        );
        lines.push(
          `Cloud thickness threshold: ${fmtRuleNum(thick === null ? 1.0 : thick, 3)}%; ` +
          `Base Line bounce tolerance: ${fmtRuleNum(kijunTol === null ? 0.35 : kijunTol, 3)}%.`
        );
        lines.push(`Delayed cross lookback: ${delayed} bars.`);
      } else if (kind === "ttm" || kind === "ttm_squeeze" || kind === "squeeze_momentum") {
        const bbLen = Math.max(2, parseInt(String(p.bb_length || "20"), 10) || 20);
        const bbMultRaw = asNumber(p.bb_mult);
        const bbMult = bbMultRaw === null ? 2.0 : Math.max(0.1, bbMultRaw);
        const kcLen = Math.max(2, parseInt(String(p.kc_length || "20"), 10) || 20);
        const kcMultRaw = asNumber(p.kc_mult);
        const kcMult = kcMultRaw === null ? 1.5 : Math.max(0.1, kcMultRaw);
        const momLen = Math.max(2, parseInt(String(p.momentum_length || "20"), 10) || 20);
        const buyCond = ttmCondTxt(p.buy_condition);
        const sellCond = ttmCondTxt(p.sell_condition);
        lines.push(
          `TTM Squeeze (BB ${bbLen}/${fmtRuleNum(bbMult, 2)}, KC ${kcLen}/${fmtRuleNum(kcMult, 2)}, MOM ${momLen}): ` +
          `BUY=${buyCond}; SELL=${sellCond}.`
        );
        lines.push("Squeeze state uses BB-inside-KC; momentum is centered linreg endpoint.");
      } else if (kind === "heikin_ashi" || kind === "ha") {
        const modeRaw = String(p.mode || "transition").trim().toLowerCase();
        const mode = (modeRaw === "state") ? "state" : "transition";
        const dojiTolRaw = asNumber(p.doji_tolerance_pct);
        if (mode === "state") {
          lines.push("Heikin Ashi state: BUY when HA candle bullish; SELL when bearish.");
        } else {
          lines.push("Heikin Ashi transition: BUY on bearish→bullish flip; SELL on bullish→bearish flip.");
        }
        if (dojiTolRaw === null) {
          lines.push("Doji tolerance: disabled (only exact HA open=close is doji).");
        } else {
          const dojiTol = Math.max(0, dojiTolRaw);
          lines.push(`Doji tolerance: candle body <= ${fmtRuleNum(dojiTol, 3)}% treated as doji.`);
        }
        if (Number(p.signal_override_enabled || 0) === 1) {
          lines.push(`Override enabled: ${scopeTxt(p.signal_override_scope)} on ${targetLabelList(p.signal_override_targets)}.`);
        }
      } else if (kind === "macd") {
        const mode = String(p.mode || "signal_cross").trim().toLowerCase();
        const fast = Math.max(2, parseInt(String(p.fast_length || "12"), 10) || 12);
        const slow = Math.max(2, parseInt(String(p.slow_length || "26"), 10) || 26);
        const signalLen = Math.max(2, parseInt(String(p.signal_length || "9"), 10) || 9);
        const modeLabel = MACD_MODE_LABEL[mode] || mode;
        lines.push(`MACD mode: ${modeLabel} (${fast}/${slow}/${signalLen}).`);
        lines.push(MACD_MODE_SUMMARY[mode] || "Buy when MACD is above signal; sell when MACD is below signal.");
        if (mode === "macd_derivative_sign") {
          const buyAboveRaw = asNumber(p.derivative_buy_above);
          const sellBelowRaw = asNumber(p.derivative_sell_below);
          const dScope = dualSignalScope(p.derivative_signal_scope);
          const buyAbove = buyAboveRaw === null ? 0 : buyAboveRaw;
          const sellBelow = sellBelowRaw === null ? 0 : sellBelowRaw;
          lines.push(`dMACD thresholds: BUY > ${fmtRuleNum(buyAbove, 4)}; SELL < ${fmtRuleNum(sellBelow, 4)}.`);
          lines.push(`dMACD side mode: ${scopeTxt(dScope)}.`);
        }
        if (Number(p.signal_override_enabled || 0) === 1) {
          lines.push(`Override enabled: ${scopeTxt(p.signal_override_scope)} on ${targetLabelList(p.signal_override_targets)}.`);
        }
      } else {
        lines.push("Unsupported rule.");
      }

      const rid = String(p.rule_id || "").trim();
      if (rid) lines.push(`Rule ID: ${rid}`);
      return lines;
    }

    function renderRules() {
      const list = b.querySelector("#if_rules_list");
      ensureAllRuleIdentity();
      if (!list) return;
      if (!indicatorForgeRules.length) {
        list.innerHTML = "<div class='small'>No rules added yet.</div>";
        syncRsiOverrideTargets();
        syncMacdOverrideTargets();
        syncHaOverrideTargets();
        syncTextarea();
        refreshPreview();
        return;
      }
      list.innerHTML = "<table><thead><tr><th>#</th><th>Name</th><th>Kind</th><th>Timeframe</th><th>Summary</th><th></th></tr></thead><tbody>" +
        indicatorForgeRules.map((r, i) => {
          const params = r && r.params && typeof r.params === "object" ? r.params : {};
          const summary = ruleSummaryHtml(r, i + 1);
          const tf = ruleTimeframe(r);
          const rows = [
            `<tr><td>${i + 1}</td><td>${escHtml(r.name || "")}</td><td>${escHtml(String(r.kind || "").toUpperCase())}</td><td><span class='badge'>TF ${escHtml(tf)}</span></td><td class='small'>${summary}</td><td><button type='button' class='btn danger if_del' data-idx='${i}'>Delete</button></td></tr>`
          ];
          if ((String(r && r.kind ? r.kind : "").trim().toLowerCase() === "ma" || String(r && r.kind ? r.kind : "").trim().toLowerCase() === "ema")
              && normalizeMaMode(params.mode) === "ribbon") {
            const rid = String(params.rule_id || "").trim();
            maRibbonLevelsFromParams(params).forEach((level) => {
              const childId = maRibbonLevelRuleId(rid, level.slot);
              const suffix = String(level.label || "L").charAt(0).toUpperCase() || "L";
              const childSummary = `${maRibbonLevelSummaryLine(level)}<br>${escHtml(`Rule ID: ${childId}`)}`;
              rows.push(
                `<tr><td>${i + 1}.${suffix}</td><td>${escHtml(maRibbonLevelDisplayName(r, level))}</td><td>RIBBON LEVEL</td><td><span class='badge'>TF ${escHtml(tf)}</span></td><td class='small'>${childSummary}</td><td></td></tr>`
              );
            });
          }
          return rows.join("");
        }).join("") +
        "</tbody></table>";
      list.querySelectorAll(".if_del").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.idx || "-1", 10);
          if (idx >= 0) indicatorForgeRules.splice(idx, 1);
          renderRules();
        });
      });
      syncRsiOverrideTargets();
      syncMacdOverrideTargets();
      syncHaOverrideTargets();
      syncTextarea();
      refreshPreview();
    }

    function syncTrailModePrompt() {
      const modeCtrl = b.querySelector("#if_exec_trail_mode");

      const isTrailingType = (val) => {
        const t = String(val || "").trim().toLowerCase();
        return t === "local_trailing" || t === "trailing_stop";
      };
      let anyTrailing = true;
      if (buyCtrl || sellCtrl) {
        anyTrailing = false;
        if (buyCtrl && isTrailingType(buyCtrl.value)) anyTrailing = true;
        if (sellCtrl && isTrailingType(sellCtrl.value)) anyTrailing = true;
      }
      if (!anyTrailing) {
        if (amountWrap) amountWrap.style.display = "none";
        if (multWrap) multWrap.style.display = "none";
        return;
      }
      const mode = String((modeCtrl && modeCtrl.value) || "fixed");
      if (amountWrap) amountWrap.style.display = mode === "fixed" ? "" : "none";
      if (multWrap) multWrap.style.display = mode === "atr" ? "" : "none";

      if (capPctWrap) capPctWrap.style.display = enabled && mode === "percent" ? "" : "none";

    function currentExecTickers() {
      const out = [];
      const seen = new Set();
      function add(raw) {
        String(raw || "").split(",").forEach((part) => {
          const sym = part.trim().toUpperCase();
          if (!sym || seen.has(sym)) return;
          seen.add(sym);
          out.push(sym);
        });
      }
      if (isEntangledTickers) {
        add((b.querySelector("#if_exec_primary_symbol") || {}).value || "");
        add((b.querySelector("#if_exec_inverse_symbol") || {}).value || "");
      } else {
        add((b.querySelector("#if_exec_symbols") || {}).value || "");
      }
      return out;
    }
    function readCapMap() {
      try {
        const obj = JSON.parse(String((capPercentInput && capPercentInput.value) || "{}"));
        return obj && typeof obj === "object" && !Array.isArray(obj) ? obj : {};
      } catch (_e) {
        return {};
      }
    }
    function writeCapMapFromRows() {
      if (!capPercentInput) return;
      const rows = b.querySelectorAll("[data-cap-symbol]");
      const obj = {};
      rows.forEach((row) => {
        const sym = String(row.getAttribute("data-cap-symbol") || "").trim().toUpperCase();
        const inp = row.querySelector("input");
        const val = parseFloat(String((inp && inp.value) || "").trim());
        if (sym && Number.isFinite(val) && val > 0) obj[sym] = val;
      });
      capPercentInput.value = JSON.stringify(obj);
      updateParams();
      refreshPreview();
    }
    function syncPerTickerCapRows() {
      const wrap = b.querySelector("#if_exec_cap_percent_rows");
      if (!wrap) return;
      const existing = readCapMap();
      const symbols = currentExecTickers();
      wrap.innerHTML = "";
      if (!symbols.length) {
        wrap.innerHTML = "<div class='small'>Enter tickers first.</div>";
        writeCapMapFromRows();
        return;
      }
      symbols.forEach((sym) => {
        const val = existing[sym] != null ? existing[sym] : 20;
        const row = document.createElement("div");
        row.setAttribute("data-cap-symbol", sym);
        row.style.marginBottom = "6px";
        row.innerHTML = `<label>${sym} Max %</label><input type="number" min="0" step="any" value="${String(val)}" />`;
        const inp = row.querySelector("input");
        inp.addEventListener("input", () => { writeCapMapFromRows(); syncCapMathHint(); });
        inp.addEventListener("change", () => { writeCapMapFromRows(); syncCapMathHint(); });
        wrap.appendChild(row);
      });
      writeCapMapFromRows();

      const current = parseFloat(String(cashCtrl.value || "").trim());
      if (Number.isFinite(current) && current > 0) return;
      const hidden = parseFloat(String(capCashInput.value || "").trim());
      const fallback = (Number.isFinite(hidden) && hidden > 0) ? hidden : divisorCashPercent();
      cashCtrl.value = fallback.toFixed(2);

    syncCapPrompt();
    syncCapMathHint();
    syncMaModeSummary();
    syncMacdSummary();
    syncHaSummary();
    syncRsiOverrideTargets();
    syncRsiSignalOverridePrompt();
    syncMacdOverrideTargets();
    syncMacdSignalOverridePrompt();

    renderRules();
    refreshPreview();
  }

  function updateParams() {
    const data = {};
    const inputs = paramFields.querySelectorAll("[data-param-key]");
    inputs.forEach((input) => {
      const key = input.dataset.paramKey;
      const type = input.dataset.paramType;
      const normalize = input.dataset.normalize;
      const defVal = input.dataset.defaultValue;
      let val;

      if (type === "boolean") {
        val = input.checked;
      } else if (type === "number") {
        const parsed = parseFloat(input.value);
        if (!isNaN(parsed)) val = parsed;
        else if (defVal !== undefined) val = parseFloat(defVal);
      } else if (type === "list") {
        const raw = String(input.value || "");
        const items = raw
          .split(",")
          .map((v) => v.trim())
          .filter(Boolean)
          .map((v) => (normalize === "upper" ? v.toUpperCase() : v));
        val = items;
      } else if (type === "textarea") {
        val = String(input.value || "");
      } else {
        val = String(input.value || "");
      }

      if (val !== undefined) data[key] = val;
    });

    paramsJson.value = JSON.stringify(data);
  }

  function applyExistingParams() {
    if (!EXISTING_PARAMS || typeof EXISTING_PARAMS !== "object") {
      return;
    }
    const inputs = paramFields.querySelectorAll("[data-param-key]");
    inputs.forEach((input) => {
      const key = input.dataset.paramKey;
      if (!(key in EXISTING_PARAMS)) return;
      const val = EXISTING_PARAMS[key];
      const type = input.dataset.paramType;
      if (type === "boolean") {
        input.checked = Boolean(val);
      } else if (type === "list") {
        if (Array.isArray(val)) {
          input.value = val.join(", ");
        } else {
          input.value = String(val || "");
        }
      } else {
        input.value = String(val ?? "");
      }
    });
  }

  function renderStrategyForgeStandalone(def) {
    const forge = document.createElement("div");
    forge.className = "card";
    forge.style.marginTop = "12px";
    forge.innerHTML = `
      <h3 style="margin:0 0 8px 0;">DreadFox Strategy Forge Backtest</h3>
      <div class="row" style="align-items:flex-end; margin-bottom:8px;">
        <div style="min-width:260px;">
          <label class="small">Search Mode</label>
          <div class="small">Open combo evolution: tests 2+ indicators and mutates settings plus indicator timeframes.</div>
        </div>
        <div style="min-width:120px;">
          <label class="small" for="generic_forge_trials">Max Evaluations</label>
          <input id="generic_forge_trials" name="trials" type="number" min="1" max="5000" step="1" value="250" style="width:120px;" />
        </div>
        <div style="min-width:140px;">
          <label class="small" for="generic_forge_min_trades">Min Trades</label>
          <input id="generic_forge_min_trades" name="min_trades" type="number" min="1" max="10000" step="1" value="100" style="width:140px;" />
        </div>
        <div style="min-width:130px;">
          <label class="small" for="generic_forge_min_rules">Min Indicators</label>
          <input id="generic_forge_min_rules" name="min_rules" type="number" min="2" max="30" step="1" value="2" style="width:130px;" />
        </div>
        <div style="min-width:130px;">
          <label class="small" for="generic_forge_max_rules">Max Indicators</label>
          <input id="generic_forge_max_rules" name="max_rules" type="number" min="2" max="30" step="1" value="5" style="width:130px;" />
        </div>
        <button type="button" class="btn primary" id="generic_forge_run_btn">Run Forge</button>
        <button type="button" class="btn" id="generic_forge_random_btn">New Random Set</button>
      </div>
      <input type="hidden" id="generic_forge_symbols" name="symbols" value="" />
      <input type="hidden" id="generic_forge_timeframe" name="timeframe" value="1h" />
      <input type="hidden" id="generic_forge_broker_hint" name="broker_hint" value="robinhood" />
      <input type="hidden" id="generic_forge_include_extended" name="include_extended_hours_data" value="false" />
      <input type="hidden" id="generic_forge_seed_mode" name="seed_mode" value="random" />
      <input type="hidden" id="generic_forge_seed_job_id" name="seed_job_id" value="" />
      <input type="hidden" id="generic_forge_nonce" name="_nonce" value="" />
      <div id="generic_forge_table"
           hx-get="/partials/strategy_forge_quick"
           hx-include="#generic_forge_symbols, #generic_forge_timeframe, #generic_forge_broker_hint, #generic_forge_include_extended, #generic_forge_trials, #generic_forge_min_trades, #generic_forge_min_rules, #generic_forge_max_rules, #generic_forge_seed_mode, #generic_forge_seed_job_id, #generic_forge_nonce"
           hx-trigger="strategy-forge-run"
           hx-swap="innerHTML"><div class="small">Ready.</div></div>
    `;
    paramFields.appendChild(forge);

    function paramValue(keys, fallback = "") {
      for (const key of keys) {
        const input = paramFields.querySelector(`[data-param-key="${key}"]`);
        if (!input) continue;
        if (input.dataset.paramType === "boolean") return input.checked ? "true" : "false";
        return String(input.value || fallback || "");
      }
      return String(fallback || "");
    }

    function syncForgeInputs() {
      const symbolsEl = forge.querySelector("#generic_forge_symbols");
      const timeframeEl = forge.querySelector("#generic_forge_timeframe");
      const brokerEl = forge.querySelector("#generic_forge_broker_hint");
      const extendedEl = forge.querySelector("#generic_forge_include_extended");
      if (symbolsEl) symbolsEl.value = paramValue(["symbols", "symbol", "tickers", "ticker", "primary_symbol"], "");
      if (timeframeEl) timeframeEl.value = paramValue(["timeframe", "interval"], "1h") || "1h";
      if (brokerEl) {
        const p = String((def && def.path) || "").toLowerCase();
        if (p.endsWith("scripts/indicatorforge.crypto.robinhood.py")) {
          brokerEl.value = "robinhood_crypto";
        } else {
          brokerEl.value = p.includes("schwab") ? "schwab" : "robinhood";
        }
      }
      if (extendedEl) extendedEl.value = (brokerEl && brokerEl.value === "robinhood_crypto") ? "true" : paramValue(["include_extended_hours_data", "extended_hours", "allow_extended_hours"], "false");
    }

    function setBusy(isBusy) {
      const buttons = forge.querySelectorAll("#generic_forge_run_btn, #generic_forge_random_btn, #generic_forge_table [data-strategy-forge-action]");
      buttons.forEach((btn) => {
        if (!btn.dataset.idleText) btn.dataset.idleText = btn.textContent || "";
        btn.disabled = Boolean(isBusy);
        if (btn.id === "generic_forge_run_btn") btn.textContent = isBusy ? "Forging..." : btn.dataset.idleText;
      });
    }

    function syncBusyFromPanel() {
      const panel = forge.querySelector("#generic_forge_table [data-forge-status]");
      if (!panel) {
        setBusy(false);
        return;
      }
      const status = String(panel.dataset.forgeStatus || "");
      setBusy(status === "queued" || status === "running");
    }

    function triggerGenericForgeRun(seedMode = "random", seedJobId = "") {
      syncForgeInputs();
      const seedModeEl = forge.querySelector("#generic_forge_seed_mode");
      const seedJobEl = forge.querySelector("#generic_forge_seed_job_id");
      if (seedModeEl) seedModeEl.value = String(seedMode || "random");
      if (seedJobEl) seedJobEl.value = String(seedJobId || "");
      const nonce = forge.querySelector("#generic_forge_nonce");
      if (nonce) nonce.value = String(Date.now());
      if (host && window.htmx) window.htmx.trigger(host, "strategy-forge-run");
    }

    const runBtn = forge.querySelector("#generic_forge_run_btn");
    const randomBtn = forge.querySelector("#generic_forge_random_btn");
    const host = forge.querySelector("#generic_forge_table");
    if (runBtn) {
      runBtn.addEventListener("click", () => triggerGenericForgeRun("random", ""));
    }
    if (randomBtn) {
      randomBtn.addEventListener("click", () => triggerGenericForgeRun("random", ""));
    }
    if (host) {
      host.addEventListener("click", (ev) => {
        const actionBtn = ev.target && ev.target.closest ? ev.target.closest("[data-strategy-forge-action]") : null;
        if (!actionBtn) return;
        ev.preventDefault();
        const action = String(actionBtn.dataset.strategyForgeAction || "");
        if (action === "continue") {
          triggerGenericForgeRun("leaderboard", actionBtn.dataset.strategyForgeJobId || "");
        } else if (action === "random") {
          triggerGenericForgeRun("random", "");
        }
      });
      host.addEventListener("htmx:beforeRequest", () => setBusy(true));
      host.addEventListener("htmx:afterRequest", syncBusyFromPanel);
      host.addEventListener("htmx:afterSwap", syncBusyFromPanel);
      host.addEventListener("htmx:responseError", () => setBusy(false));
      host.addEventListener("htmx:sendError", () => setBusy(false));
      host.addEventListener("htmx:timeout", () => setBusy(false));
    }
    paramFields.querySelectorAll("[data-param-key]").forEach((input) => {
      input.addEventListener("input", syncForgeInputs);
      input.addEventListener("change", syncForgeInputs);
    });
    syncForgeInputs();
    setBusy(false);
  }

  function renderParams() {
    paramFields.innerHTML = "";
    const def = BASE_ALGO_DEFS[String(baseSelect.value)];
    if (!def) {
      renderBaseDescription("");
      paramsJson.value = "{}";
      return;
    }
    renderBaseDescription(def.description || "");
    const params = def.params || [];
    if (!params.length) {
      const empty = document.createElement("div");
      empty.className = "small";
      empty.textContent = "No additional parameters required.";
      paramFields.appendChild(empty);
      paramsJson.value = "{}";
      return;
    }
    params.forEach((p) => {
      const wrap = buildInput(p);
      paramFields.appendChild(wrap);
    });
    applyExistingParams();
    if (isIndicatorForge(def)) {
      renderIndicatorForgeBuilder();
    } else {
      renderStrategyForgeStandalone(def);
    }
    updateParams();
  }

  baseSelect.addEventListener("change", renderParams);
  renderParams();
</script>
{% endblock %}
